name: Build and Package

on:
  push:
    branches: ["main"]
    tags: ["v*", "*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            artifact: 'qt6.10.1-essentials'
            modules: 'qt.qt6.6101.addons.qt5compat qt.qt6.6101.addons.qtimageformats qt.qt6.6101.addons.qtmultimedia'
          - os: windows-latest
            artifact: 'qt6.10.1-msvc2022-essentials'
            modules: 'qt.qt6.6101.addons.qt5compat qt.qt6.6101.addons.qtimageformats qt.qt6.6101.addons.qtmultimedia'
          - os: macos-latest
            artifact: 'qt6.10.1-essentials'
            modules: 'qt.qt6.6101.addons.qt5compat qt.qt6.6101.addons.qtimageformats qt.qt6.6101.addons.qtmultimedia'
          - os: ubuntu-24.04-arm
            artifact: 'qt6.10.1-essentials'
            modules: 'qt.qt6.6101.addons.qt5compat qt.qt6.6101.addons.qtimageformats qt.qt6.6101.addons.qtmultimedia'

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup vcpkg
        if: startsWith(matrix.os, 'windows-')
        run: ./vcpkg/bootstrap-vcpkg

      - name: Setup vcpkg for Linux and macOS
        if: startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-')
        run: ./vcpkg/bootstrap-vcpkg.sh

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: startsWith(matrix.os, 'windows-')
        with:
          arch: x64
      
      - uses: repolevedavaj/install-nsis@v1.1.0
        if: startsWith(matrix.os, 'windows-')
        with:
          nsis-version: '3.11'

      - name: Install Qt
        uses: akshaybabloo/actions-setup-qt@v1
        with:
          username: ${{ secrets.QT_USERNAME }}
          password: ${{ secrets.QT_PASSWORD }}
          version: ${{ matrix.artifact}}
          modules: ${{ matrix.modules }}
          install-deps: 'true'
          cache: 'true'

      - name: Install CMake 4+
        uses: akshaybabloo/actions-setup-cmake@v1
        with:
          cmake-version: "4.1.x"

      - name: Run vcpkg install
        run: ${{ github.workspace }}/vcpkg/vcpkg install

      - name: Get version from Git tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract version from tag (remove 'v' prefix if present)
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
            echo "Using version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Fallback for non-tag builds (development builds)
            VERSION=0.0.${{ github.run_number }}
            echo "Using fallback version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Configure CMake
        run: cmake -B build -S . -DGAV_VERSION=${{ steps.version.outputs.version }} -DCMAKE_TOOLCHAIN_FILE=${{env.QT_ROOT_DIR}}/lib/cmake/Qt6/qt.toolchain.cmake -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -GNinja

      - name: Build
        run: |
          cd build
          ninja

      - name: Package
        run: |
          cd build
          ninja package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: build/packages/*

  pre-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && contains(github.ref_name, '-')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: ./dist

      - name: List downloaded files
        run: |
          echo "Downloaded packages:"
          ls -la ./dist/

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pre-Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: ./dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: ./dist

      - name: List downloaded files
        run: |
          echo "Downloaded packages:"
          ls -la ./dist/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./dist/*