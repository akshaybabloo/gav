name: Build and Package

on:
  push:
    branches: ["main"]
    tags: ["v*", "*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
#      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            artifact: 'qt6.11.1-essentials'
            modules: 'qt.qt6.6111.addons.qt5compat qt.qt6.6111.addons.qtimageformats qt.qt6.6111.addons.qtmultimedia'
            qt_tag: 'v6.11.1'
          - os: windows-latest
            artifact: 'qt6.11.1-msvc2022-essentials'
            modules: 'qt.qt6.6111.addons.qt5compat qt.qt6.6111.addons.qtimageformats qt.qt6.6111.addons.qtmultimedia'
            qt_tag: 'v6.11.1'
          - os: macos-latest
            artifact: 'qt6.11.1-essentials'
            modules: 'qt.qt6.6111.addons.qt5compat qt.qt6.6111.addons.qtimageformats qt.qt6.6111.addons.qtmultimedia'
            qt_tag: 'v6.11.1'
          - os: ubuntu-24.04-arm
            artifact: 'qt6.11.1-essentials'
            modules: 'qt.qt6.6111.addons.qt5compat qt.qt6.6111.addons.qtimageformats qt.qt6.6111.addons.qtmultimedia'
            qt_tag: 'v6.11.1'

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: startsWith(matrix.os, 'windows-')
        with:
          arch: x64
      
      - uses: repolevedavaj/install-nsis@v1.2.1
        if: startsWith(matrix.os, 'windows-')
        with:
          nsis-version: '3.11'

      - name: Install AppImage tooling (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y patchelf
          ARCH=$(uname -m)
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage" -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          # Extract to avoid the FUSE dependency, then expose AppRun as `appimagetool` on PATH.
          (cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null)
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
        shell: bash

      - name: Install FFmpeg build dependencies (Linux)
        # Pulled in by vcpkg's ffmpeg features (vaapi, audio backend, assembler) — vcpkg expects these on PATH.
        # libdrm-dev is required by libva (vcpkg's libva port explicitly tells you to apt-install it).
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -e
          sudo apt-get install -y nasm libdrm-dev libva-dev libpipewire-0.3-dev libpulse-dev
        shell: bash

      - name: Install Qt
        uses: akshaybabloo/actions-setup-qt@v1
        with:
          username: ${{ secrets.QT_USERNAME }}
          password: ${{ secrets.QT_PASSWORD }}
          version: ${{ matrix.artifact}}
          modules: ${{ matrix.modules }}
          install-deps: 'true'
          cache: 'true'

      - name: Install CMake 4+
        uses: akshaybabloo/actions-setup-cmake@v2
        with:
          cmake-version: "4.3.x"

      - name: Bootstrap vcpkg (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Bootstrap vcpkg (Linux/macOS)
        if: startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-')
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        shell: bash

      - name: Run vcpkg install (Windows)
        # Use x64-windows-static so FFmpeg statically links into the qtmultimedia plugin DLL (matches Linux/macOS).
        # The whole project's vcpkg deps (fmt, spdlog, gtest) become static on Windows as a consequence.
        if: startsWith(matrix.os, 'windows-')
        run: ./vcpkg/vcpkg install --triplet=x64-windows-static
        shell: bash

      - name: Run vcpkg install (Linux/macOS)
        if: startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-')
        run: ./vcpkg/vcpkg install
        shell: bash

      - name: Cache custom qtmultimedia plugin
        id: cache-qtmm
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qtmm-sandbox
          # Bump the trailing -vN to invalidate on demand. Auto-busts when the matrix Qt tag, Qt installer artifact,
          # FFmpeg pin in vcpkg.json, or any qtmultimedia patch changes.
          key: qtmm-${{ matrix.os }}-${{ matrix.qt_tag }}-${{ matrix.artifact }}-${{ hashFiles('vcpkg.json', 'support/qtmultimedia-*.patch') }}-v1

      - name: Build custom qtmultimedia plugin (Linux/macOS)
        if: steps.cache-qtmm.outputs.cache-hit != 'true' && (startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-'))
        run: |
          set -e
          git clone --depth 1 --branch "${{ matrix.qt_tag }}" https://code.qt.io/qt/qtmultimedia.git "${{ github.workspace }}/qtmm-src"
          # Apply every qtmultimedia patch we ship (Apple Silicon SIMD fix, macOS 15 SDK fix, ...).
          # Each patch is a no-op on platforms it doesn't apply to (Linux/Windows only touch shared files).
          for p in "${{ github.workspace }}/support"/qtmultimedia-*.patch; do
            echo "Applying $p"
            patch -p1 --fuzz=3 --directory="${{ github.workspace }}/qtmm-src" --input="$p"
          done
          cmake -B "${{ github.workspace }}/qtmm-src/build" -S "${{ github.workspace }}/qtmm-src" -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}/lib/cmake" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/qtmm-sandbox" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed" \
            -DQT_DEPLOY_FFMPEG=OFF \
            -DFEATURE_ffmpeg=ON
          cmake --build "${{ github.workspace }}/qtmm-src/build"
          cmake --install "${{ github.workspace }}/qtmm-src/build"
        shell: bash

      - name: Build custom qtmultimedia plugin (Windows)
        if: steps.cache-qtmm.outputs.cache-hit != 'true' && startsWith(matrix.os, 'windows-')
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 --branch "${{ matrix.qt_tag }}" https://code.qt.io/qt/qtmultimedia.git "$env:GITHUB_WORKSPACE\qtmm-src"
          cmake -B "$env:GITHUB_WORKSPACE\qtmm-src\build" -S "$env:GITHUB_WORKSPACE\qtmm-src" -G Ninja `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake" `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\qtmm-sandbox" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DQT_DEPLOY_FFMPEG=OFF `
            -DFEATURE_ffmpeg=ON
          cmake --build "$env:GITHUB_WORKSPACE\qtmm-src\build"
          cmake --install "$env:GITHUB_WORKSPACE\qtmm-src\build"
        shell: pwsh

      - name: Locate custom qtmultimedia plugin
        id: qtmm-plugin
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            PLUGIN=$(find "${{ github.workspace }}/qtmm-sandbox" -name 'ffmpegmediaplugin.dll' | head -1)
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            PLUGIN=$(find "${{ github.workspace }}/qtmm-sandbox" -name 'libffmpegmediaplugin.dylib' | head -1)
          else
            PLUGIN=$(find "${{ github.workspace }}/qtmm-sandbox" -name 'libffmpegmediaplugin.so' | head -1)
          fi
          if [[ -z "$PLUGIN" ]]; then
            echo "ERROR: custom ffmpegmediaplugin not found under ${{ github.workspace }}/qtmm-sandbox" >&2
            find "${{ github.workspace }}/qtmm-sandbox" -name '*ffmpegmediaplugin*' || true
            exit 1
          fi
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
          echo "Custom qtmultimedia plugin: $PLUGIN"
        shell: bash

      - name: Get version from Git tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract version from tag (remove 'v' prefix if present)
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
            echo "Using version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Fallback for non-tag builds (development builds)
            VERSION=0.0.${{ github.run_number }}
            echo "Using fallback version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Configure CMake (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: cmake -B build -S . -DGAV_VERSION="${{ steps.version.outputs.version }}" -DCMAKE_TOOLCHAIN_FILE=${{env.QT_ROOT_DIR}}/lib/cmake/Qt6/qt.toolchain.cmake -DX_VCPKG_APPLOCAL_DEPS_INSTALL:BOOL=ON -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DGAV_QTMULTIMEDIA_PLUGIN="${{ steps.qtmm-plugin.outputs.plugin }}" -DCMAKE_BUILD_TYPE=Release -GNinja
        shell: pwsh

      - name: Configure CMake (Linux/macOS)
        if: startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-')
        run: cmake -B build -S . -DGAV_VERSION=${{ steps.version.outputs.version }} -DCMAKE_TOOLCHAIN_FILE=${{env.QT_ROOT_DIR}}/lib/cmake/Qt6/qt.toolchain.cmake -DX_VCPKG_APPLOCAL_DEPS_INSTALL:BOOL=ON -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DGAV_QTMULTIMEDIA_PLUGIN="${{ steps.qtmm-plugin.outputs.plugin }}" -DCMAKE_BUILD_TYPE=Release -GNinja
        shell: bash

      - name: Build
        run: |
          cd build
          ninja

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --verbose
        continue-on-error: false

      - name: Package
        run: |
          cd build
          ninja package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: build/packages/*

  pre-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && contains(github.ref_name, '-')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: ./dist

      - name: List downloaded files
        run: |
          echo "Downloaded packages:"
          ls -la ./dist/

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Pre-Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: ./dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: ./dist

      - name: List downloaded files
        run: |
          echo "Downloaded packages:"
          ls -la ./dist/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./dist/*