name: Build and Package

on:
  push:
    branches: ["main"]
    tags: ["v*", "*.*.*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "renovate.json"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "renovate.json"
  schedule:
    - cron: "0 18 */5 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VCPKG_COMMIT: 4b6825283f814d7f522aafd11990454ed39e9983

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
    strategy:
#      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            artifact: 'qt6.11.1-essentials'
            modules: 'qt.qt6.6111.addons.qt5compat qt.qt6.6111.addons.qtimageformats qt.qt6.6111.addons.qtmultimedia qt.qt6.6111.addons.qtquick3d'
            qt_tag: 'v6.11.1'
            triplet: 'x64-linux-release'
            host_triplet: 'x64-linux-release'
          - os: windows-latest
            artifact: 'qt6.11.1-msvc2022-essentials'
            modules: 'qt.qt6.6111.addons.qt5compat qt.qt6.6111.addons.qtimageformats qt.qt6.6111.addons.qtmultimedia qt.qt6.6111.addons.qtquick3d'
            qt_tag: 'v6.11.1'
            triplet: 'x64-windows-static-md-release'
            host_triplet: 'x64-windows'
          - os: macos-latest
            artifact: 'qt6.11.1-essentials'
            modules: 'qt.qt6.6111.addons.qt5compat qt.qt6.6111.addons.qtimageformats qt.qt6.6111.addons.qtmultimedia qt.qt6.6111.addons.qtquick3d'
            qt_tag: 'v6.11.1'
            triplet: 'arm64-osx-release'
            host_triplet: 'arm64-osx-release'
          - os: ubuntu-24.04-arm
            artifact: 'qt6.11.1-essentials'
            modules: 'qt.qt6.6111.addons.qt5compat qt.qt6.6111.addons.qtimageformats qt.qt6.6111.addons.qtmultimedia qt.qt6.6111.addons.qtquick3d'
            qt_tag: 'v6.11.1'
            triplet: 'arm64-linux-release'
            host_triplet: 'arm64-linux-release'

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: startsWith(matrix.os, 'windows-')
        with:
          arch: x64

      - uses: repolevedavaj/install-nsis@v1.3.0
        if: startsWith(matrix.os, 'windows-')
        with:
          nsis-version: '3.11'

      - name: Install AppImage tooling (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y patchelf
          ARCH=$(uname -m)
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage" -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          # Extract to avoid the FUSE dependency, then expose AppRun as `appimagetool` on PATH.
          (cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null)
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
        shell: bash

      - name: Install FFmpeg build dependencies (Linux)
        # Pulled in by vcpkg's ffmpeg features (vaapi, audio backend, assembler) — vcpkg expects these on PATH.
        # libdrm-dev is required by libva (vcpkg's libva port explicitly tells you to apt-install it).
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -e
          sudo apt-get install -y nasm libdrm-dev libva-dev libpipewire-0.3-dev libpulse-dev
        shell: bash

      - name: Install Qt
        uses: akshaybabloo/actions-setup-qt@v1
        with:
          username: ${{ secrets.QT_USERNAME }}
          password: ${{ secrets.QT_PASSWORD }}
          version: ${{ matrix.artifact}}
          modules: ${{ matrix.modules }}
          install-deps: 'true'
          cache: 'true'

      - name: Install CMake 4+
        uses: akshaybabloo/actions-setup-cmake@v2
        with:
          cmake-version: "4.4.x"

      - name: Compute cache keys
        id: keys
        run: |
          set -euo pipefail
          sha() { if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi; }
          FFMPEG=$(jq -cS '{feature: .features.ffmpeg, overrides: [.overrides[]? | select(.name == "ffmpeg")]}' vcpkg.json | tr -d '\r' | sha | cut -c1-16)
          echo "ffmpeg=$FFMPEG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore custom qtmultimedia plugin
        id: cache-qtmm
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/qtmm-sandbox
          key: qtmm-${{ matrix.os }}-${{ matrix.triplet }}-${{ matrix.qt_tag }}-${{ matrix.artifact }}-${{ env.VCPKG_COMMIT }}-${{ steps.keys.outputs.ffmpeg }}-${{ hashFiles('support/qtmultimedia-*.patch') }}-v3

      - name: Prepare vcpkg binary cache dir
        run: mkdir -p vcpkg-bincache
        shell: bash

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-

      - name: Bootstrap vcpkg (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Bootstrap vcpkg (Linux/macOS)
        if: startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-')
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        shell: bash

      - name: Run vcpkg install
        id: vcpkg
        run: |
          set -euo pipefail
          find vcpkg-bincache -name '*.zip' | sort > "$RUNNER_TEMP/bincache-before.txt"
          ARGS=(--triplet="${{ matrix.triplet }}" --host-triplet="${{ matrix.host_triplet }}")
          if [[ "${{ steps.cache-qtmm.outputs.cache-hit }}" == "true" ]]; then
            ARGS+=(--x-no-default-features)
          fi
          ./vcpkg/vcpkg install "${ARGS[@]}"
          find vcpkg-bincache -name '*.zip' | sort > "$RUNNER_TEMP/bincache-after.txt"
          if [[ "$(cat "$RUNNER_TEMP/bincache-before.txt")" == "$(cat "$RUNNER_TEMP/bincache-after.txt")" ]]; then
            exit 0
          fi
          if [[ "${{ steps.cache-qtmm.outputs.cache-hit }}" != "true" ]]; then
            sha() { if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi; }
            for f in vcpkg_installed/*/share/*/vcpkg_abi_info.txt; do sha < "$f" | cut -d' ' -f1; done > "$RUNNER_TEMP/abi-keep.txt"
            if [[ -s "$RUNNER_TEMP/abi-keep.txt" ]]; then
              { grep -vFf "$RUNNER_TEMP/abi-keep.txt" "$RUNNER_TEMP/bincache-after.txt" || true; } | while read -r f; do rm -f "$f"; done
            fi
          fi
          echo "save=true" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Save vcpkg binary cache
        if: steps.vcpkg.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build custom qtmultimedia plugin (Linux/macOS)
        if: steps.cache-qtmm.outputs.cache-hit != 'true' && (startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-'))
        run: |
          set -e
          git clone --depth 1 --branch "${{ matrix.qt_tag }}" https://code.qt.io/qt/qtmultimedia.git "${{ github.workspace }}/qtmm-src"
          # Apply every qtmultimedia patch we ship (Apple Silicon SIMD fix, macOS 15 SDK fix, ...).
          # Each patch is a no-op on platforms it doesn't apply to (Linux/Windows only touch shared files).
          for p in "${{ github.workspace }}/support"/qtmultimedia-*.patch; do
            echo "Applying $p"
            patch -p1 --fuzz=3 --directory="${{ github.workspace }}/qtmm-src" --input="$p"
          done
          cmake -B "${{ github.workspace }}/qtmm-src/build" -S "${{ github.workspace }}/qtmm-src" -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}/lib/cmake" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/qtmm-sandbox" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DQT_DEPLOY_FFMPEG=OFF \
            -DFEATURE_ffmpeg=ON \
            -DFEATURE_spatialaudio=ON
          cmake --build "${{ github.workspace }}/qtmm-src/build"
          cmake --install "${{ github.workspace }}/qtmm-src/build"
        shell: bash

      - name: Build custom qtmultimedia plugin (Windows)
        if: steps.cache-qtmm.outputs.cache-hit != 'true' && startsWith(matrix.os, 'windows-')
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 --branch "${{ matrix.qt_tag }}" https://code.qt.io/qt/qtmultimedia.git "$env:GITHUB_WORKSPACE\qtmm-src"
          # qtmultimedia 6.11 still uses <experimental/coroutine>, which VS 18 / MSVC 14.51 hard-errors on. Silence
          # the deprecation static_assert via the macro MSVC itself points at in the error message.
          cmake -B "$env:GITHUB_WORKSPACE\qtmm-src\build" -S "$env:GITHUB_WORKSPACE\qtmm-src" -G Ninja `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake" `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\qtmm-sandbox" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DCMAKE_CXX_FLAGS="/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" `
            -DQT_DEPLOY_FFMPEG=OFF `
            -DFEATURE_ffmpeg=ON `
            -DFEATURE_spatialaudio=ON
          cmake --build "$env:GITHUB_WORKSPACE\qtmm-src\build"
          cmake --install "$env:GITHUB_WORKSPACE\qtmm-src\build"
        shell: pwsh

      - name: Stash FFmpeg version header
        if: steps.cache-qtmm.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p qtmm-sandbox/ffmpeg-include/libavutil
          cp "vcpkg_installed/${{ matrix.triplet }}/include/libavutil/ffversion.h" qtmm-sandbox/ffmpeg-include/libavutil/
        shell: bash

      - name: Save custom qtmultimedia plugin
        if: steps.cache-qtmm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/qtmm-sandbox
          key: ${{ steps.cache-qtmm.outputs.cache-primary-key }}

      - name: Locate custom qtmultimedia plugin
        id: qtmm-plugin
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            PLUGIN=$(find "${{ github.workspace }}/qtmm-sandbox" -name 'ffmpegmediaplugin.dll' | head -1)
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            PLUGIN=$(find "${{ github.workspace }}/qtmm-sandbox" -name 'libffmpegmediaplugin.dylib' | head -1)
          else
            PLUGIN=$(find "${{ github.workspace }}/qtmm-sandbox" -name 'libffmpegmediaplugin.so' | head -1)
          fi
          if [[ -z "$PLUGIN" ]]; then
            echo "ERROR: custom ffmpegmediaplugin not found under ${{ github.workspace }}/qtmm-sandbox" >&2
            find "${{ github.workspace }}/qtmm-sandbox" -name '*ffmpegmediaplugin*' || true
            exit 1
          fi
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_include=${{ github.workspace }}/qtmm-sandbox/ffmpeg-include" >> "$GITHUB_OUTPUT"
          echo "Custom qtmultimedia plugin: $PLUGIN"
        shell: bash

      - name: Get version from Git tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract version from tag (remove 'v' prefix if present)
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
            echo "Using version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Fallback for non-tag builds (development builds)
            VERSION=0.0.${{ github.run_number }}
            echo "Using fallback version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Configure CMake (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: cmake -B build -S . -DGAV_VERSION="${{ steps.version.outputs.version }}" -DCMAKE_TOOLCHAIN_FILE=${{env.QT_ROOT_DIR}}/lib/cmake/Qt6/qt.toolchain.cmake -DX_VCPKG_APPLOCAL_DEPS_INSTALL:BOOL=ON -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }} -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed" -DGAV_FFMPEG_INCLUDE_DIR="${{ steps.qtmm-plugin.outputs.ffmpeg_include }}" -DGAV_QTMULTIMEDIA_PLUGIN="${{ steps.qtmm-plugin.outputs.plugin }}" -DCMAKE_BUILD_TYPE=Release -GNinja
        shell: pwsh

      - name: Configure CMake (Linux/macOS)
        if: startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-')
        run: cmake -B build -S . -DGAV_VERSION=${{ steps.version.outputs.version }} -DCMAKE_TOOLCHAIN_FILE=${{env.QT_ROOT_DIR}}/lib/cmake/Qt6/qt.toolchain.cmake -DX_VCPKG_APPLOCAL_DEPS_INSTALL:BOOL=ON -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }} -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed" -DGAV_FFMPEG_INCLUDE_DIR="${{ steps.qtmm-plugin.outputs.ffmpeg_include }}" -DGAV_QTMULTIMEDIA_PLUGIN="${{ steps.qtmm-plugin.outputs.plugin }}" -DCMAKE_BUILD_TYPE=Release -GNinja
        shell: bash

      - name: Build
        run: |
          cd build
          ninja

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --verbose
        continue-on-error: false

      - name: Package
        run: |
          cd build
          ninja package

      - name: Upload build artifacts
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: build/packages/*

  pre-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && contains(github.ref_name, '-')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: ./dist

      - name: List downloaded files
        run: |
          echo "Downloaded packages:"
          ls -la ./dist/

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Pre-Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: ./dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: ./dist

      - name: List downloaded files
        run: |
          echo "Downloaded packages:"
          ls -la ./dist/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./dist/*
